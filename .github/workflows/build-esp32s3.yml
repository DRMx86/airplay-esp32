name: Build ESP32-S3

# Builds only the plain esp32s3 board (no lint/format gate, no other boards).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Build esp32s3
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          command: >
            idf.py -DSDKCONFIG_DEFAULTS="config/sdkconfig.defaults;config/sdkconfig.defaults.esp32s3" build &&
            cd build &&
            esptool.py --chip esp32s3 merge_bin --format raw -o merged-firmware.bin $(cat flash_args) &&
            cp merged-firmware.bin ../airplay2-receiver-esp32s3.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v6
        with:
          name: firmware-esp32s3
          path: airplay2-receiver-esp32s3.bin
